services:
  - type: web
    name: project-magang
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /up
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        value: https://project-magang.onrender.com
      - key: ASSET_URL
        value: https://project-magang.onrender.com
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: project-magang-db
          property: connectionString
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: CACHE_STORE
        value: database
      - key: FILESYSTEM_DISK
        value: public
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_NAME
        value: Admin Support B2G
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: project-magang-db
    databaseName: project_magang
    user: project_magang
    plan: free
    postgresMajorVersion: "17"
